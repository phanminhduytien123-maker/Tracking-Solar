; =========================================================================
; MASTER PLATFORMIO CONFIGURATION FOR DATN TRACKING SOLAR
; Quản lý đồng thời cả 2 mạch ESP32-S3 trong cùng 1 Workspace
; =========================================================================

[platformio]
default_envs = esp32_devkit_test
build_dir = C:/tmp_pio_build/master_solar

; -------------------------------------------------------------------------
; 0. ESP32 DEVKIT V1: MẠCH TEST THỬ NGHIỆM INA226 + LED RGB (DIN)
; -------------------------------------------------------------------------
[env:esp32_devkit_test]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_port = COM12
monitor_port = COM12

build_src_filter = +<../firmware/esp32_devkit_test/src/>
build_flags = 
    -I firmware/esp32_devkit_test/include
    -D FIREBASE_ENABLE_RTDB=1
    -D FIREBASE_DISABLE_FIRESTORE
    -D FIREBASE_DISABLE_FCM
    -D FIREBASE_DISABLE_STORAGE
    -D FIREBASE_DISABLE_FUNCTIONS
    -D FIREBASE_DISABLE_GCS

lib_deps = 
    https://github.com/mobizt/Firebase-ESP-Client.git
    robtillaart/INA226 @ ^0.6.0
    adafruit/Adafruit NeoPixel @ ^1.12.0
    bblanchon/ArduinoJson @ ^7.3.0
    Wire
    WiFi


; -------------------------------------------------------------------------
; 1. ESP32-S3 #1: TẤM PIN XOAY THÔNG MINH (TRACKER)
; -------------------------------------------------------------------------
[env:esp32_tracker]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_src_filter = +<../firmware/esp32_tracker/src/>
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I firmware/esp32_tracker/include

lib_deps = 
    https://github.com/mobizt/Firebase-ESP-Client.git
    adafruit/Adafruit  INA226 @ ^1.2.3
    bblanchon/ArduinoJson @ ^7.3.0
    adafruit/Adafruit BusIO @ ^1.16.1
    Wire
    WiFi

; -------------------------------------------------------------------------
; 2. ESP32-S3 #2: TẤM PIN CỐ ĐỊNH (STATIC / FIXED)
; -------------------------------------------------------------------------
[env:esp32_static]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_src_filter = +<../firmware/esp32_static/src/>
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I firmware/esp32_static/include

lib_deps = 
    https://github.com/mobizt/Firebase-ESP-Client.git
    adafruit/Adafruit  INA226 @ ^1.2.3
    bblanchon/ArduinoJson @ ^7.3.0
    adafruit/Adafruit BusIO @ ^1.16.1
    Wire
    WiFi
