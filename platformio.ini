; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32_devkit_test
build_dir = C:/tmp_pio_build/root

[env:esp32_devkit_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
build_src_filter = +<../firmware/esp32_devkit_test/src/> +<../firmware/esp32_tracker_control/lib/solar_core/>
build_flags = 
	-UARDUINO_USB_MODE
	-DARDUINO_USB_MODE=0
	-UARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I firmware/esp32_devkit_test/include
	-I firmware/esp32_tracker_control/include
	-I firmware/esp32_tracker_control/lib/solar_core
build_src_flags = 
	-Wall
	-Wextra
lib_deps = 
	Wire
	WiFi
	https://github.com/mobizt/Firebase-ESP-Client.git
	gin66/FastAccelStepper
	robtillaart/INA226 @ ^0.6.6

[env:esp32_devkit_test_ota]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = espota
upload_port = 192.168.1.9
upload_flags = 
	--auth=solar2026
	--port=3232
	--timeout=30
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
build_src_filter = +<../firmware/esp32_devkit_test/src/> +<../firmware/esp32_tracker_control/lib/solar_core/>
build_flags = 
	-UARDUINO_USB_MODE
	-DARDUINO_USB_MODE=0 
	-UARDUINO_USB_CDC_ON_BOOT
	-DARDUINO_USB_CDC_ON_BOOT=0
	-I firmware/esp32_devkit_test/include
	-I firmware/esp32_tracker_control/include
	-I firmware/esp32_tracker_control/lib/solar_core
build_src_flags = 
	-Wall
	-Wextra
lib_deps = 
	Wire
	WiFi
	https://github.com/mobizt/Firebase-ESP-Client.git
	gin66/FastAccelStepper
	robtillaart/INA226 @ ^0.6.6

