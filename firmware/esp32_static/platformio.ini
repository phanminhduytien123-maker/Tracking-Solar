; PlatformIO Project Configuration File for ESP32-S3 Static (Fixed) Solar Panel
; Comparison node for DATN Tracking Solar

[platformio]
build_dir = C:/tmp_pio_build/esp32_static

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
    https://github.com/mobizt/Firebase-ESP-Client.git
    adafruit/Adafruit  INA226 @ ^1.2.3
    bblanchon/ArduinoJson @ ^7.3.0
    adafruit/Adafruit BusIO @ ^1.16.1
    Wire
    WiFi
