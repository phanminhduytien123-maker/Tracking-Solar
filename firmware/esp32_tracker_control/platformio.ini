; =========================================================================
; PLATFORMIO CONFIGURATION FOR ESP32-S3 SOLAR TRACKER CONTROL SYSTEM
; Pure Control Core + ESP-IDF HAL + Native Unit Testing
; =========================================================================

[platformio]
default_envs = native
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

; -------------------------------------------------------------------------
; 1. MÔI TRƯỜNG NATIVE TRÊN PC (Dùng cho Unit Test kiểm thử thuật toán thuần)
; Chạy lệnh: pio test -e native
; -------------------------------------------------------------------------
[env:native]
platform = native
build_flags = 
    -std=c++17
    -I include
    -I lib/solar_core
    -D UNIT_TEST_NATIVE
    -Wall
    -Wextra

; -------------------------------------------------------------------------
; 2. MÔI TRƯỜNG ESP32-S3 THẬT (Framework ESP-IDF theo yêu cầu đề tài)
; Nạp board: esp32-s3-devkitc-1
; -------------------------------------------------------------------------
[env:esp32s3_control]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_flags = 
    -std=gnu++17
    -I include
    -I lib/solar_core
    -I lib/solar_hal
    -D CORE_DEBUG_LEVEL=3
